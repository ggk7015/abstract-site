name: discord-mirror

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Pull Discord messages into the site mirror
        env:
          MIRROR_URL: ${{ secrets.MIRROR_URL }}
          MIRROR_KEY: ${{ secrets.MIRROR_KEY }}
        run: |
          curl -sS -X POST \
            -H "authorization: Bearer $MIRROR_KEY" \
            "$MIRROR_URL"
